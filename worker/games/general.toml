# 預設的相簿設定（一般攝影）。setup.sh 會複製成 games/default.toml：沒有自己設定檔的相簿都用這份。
# 一般攝影：AI 依對焦、表情、構圖選片，給星等與標籤，不寫圖說（省錢）。
# 想要圖說：把這份複製成 games/<相簿名稱>.toml，打開下面的「拍攝計劃」（選用）——有計劃才寫圖說，
#   而且只替 5 星的精選寫（worker/.env 的 CAPTION_MIN_STARS 可以改）。
# 拍體育比賽：改用 example.toml（賽事、主客隊、名單）。

[game]
lang = "zh"                          # zh / en
creator = ""                         # 攝影師署名（寫進照片的 IPTC）
credit = "SnapPipe"
# subject = "cosplay portrait photoshoot"   # 拍攝題材，給 AI 參考（英文較準），例 wedding / concert / street
# captions = false                   # 有寫拍攝計劃也不要圖說
# person = "一名 Coser"              # 認不出是誰時的稱呼（預設「一名人物」）

# ---- 拍攝計劃（選用）：讓圖說寫對名字、服裝、道具與場景 ----
# notes：道具、場景、主題。只當參考，照片裡看得到才會寫
# notes = "Cosplay 外拍。場景：中式庭園、室內攝影棚。道具：紅色油紙傘、長煙管。"
#
# 每個人一段：AI 只回報「畫面裡的人符合第幾個人的外觀」，name 由系統填進圖說，不會送給 AI
# [[people]]
# name = "Saki"                      # 圖說裡的名字
# character = "角色名"               # 扮演的角色（沒有就留空）
# look = "藍色假髮、黑底紅邊中式服裝、紅色圓形墨鏡"   # 外觀特徵，多人時靠這個分辨

# 每台相機由誰拍：機身序號（完整或末幾碼）= 署名
[cameras]
# "5530" = "李攝影"
